# Desk Calendar config. Copy to ~/.config/deskcal/config.toml
# (install.sh does this for you). Restart after editing:
#   systemctl --user restart deskcal

# Calendar feeds: the Apps Script web app from apps_script/Code.gs, one per
# Google account. One-time setup: see "Calendar feed" in README.md.
# The URLs are secrets, so keep them out of this file: put them in
# ~/.config/deskcal/.env (see .env.example) and refer to them as "${NAME}".
calendars = [
  # { name = "Work", url = "${DESKCAL_WORK_FEED_URL}" },
]

# How often to re-download the calendars.
refresh_minutes = 5

# Chime + flash the screen this many minutes before each meeting...
alert_minutes_before = [5]
# ...and again when it starts.
alert_at_start = true

# Chime volume, 0.0–1.0
volume = 0.8

clock_24h = false
